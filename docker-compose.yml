# Docker Compose pour RestoConnect360
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: restoconnect-postgres
    environment:
      POSTGRES_DB: restoconnect360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restoconnect-network

  redis:
    image: redis:7-alpine
    container_name: restoconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - restoconnect-network

  backend:
    build: ./restoconnect-backend
    container_name: restoconnect-backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/restoconnect360
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./restoconnect-backend:/app
      - /app/node_modules
    networks:
      - restoconnect-network

  frontend:
    build: ./restoconnect-frontend
    container_name: restoconnect-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./restoconnect-frontend:/app
      - /app/node_modules
    networks:
      - restoconnect-network

volumes:
  postgres_data:
  redis_data:

networks:
  restoconnect-network:
    driver: bridge
